// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "1.7.20"
    ext.core_ktx_version = "1.8.0"
    ext.ktx_activity_version = "1.5.1"
    ext.ktx_fragment_version = "1.5.1"
    ext.appcompat_version = "1.4.2"
    ext.constraintlayout_version = "2.1.4"
    ext.material_version = '1.6.1'
    ext.lifecycle_version = '2.5.1'
    ext.nav_version_ktx = "2.5.1"
    ext.paging_version = '3.0.1'
    ext.viewpager_version = "1.0.0"
    ext.room_version = '2.4.3'
    ext.retrofit_version = '2.9.0'
    ext.hilt_version = '2.37'
    ext.work_version = '2.7.0'
    ext.kotlin_coroutine_version = '1.6.1'
    ext.gson_version = "2.9.0"
    ext.okhttp_version = "4.9.3"
    ext.ktx_prefs_version = "1.2.0"
    ext.dexter_version = "6.2.3"

    ext.auth_phone_version = "18.0.1"
    ext.maps_version = "18.1.0"
    ext.location_version = "20.0.0"

    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:7.0.4"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

//        classpath 'com.google.gms:google-services:4.3.10'
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version_ktx"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"

        classpath "com.google.android.libraries.mapsplatform.secrets-gradle-plugin:secrets-gradle-plugin:2.0.1"
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}


task clean(type: Delete) {
    delete rootProject.buildDir
}